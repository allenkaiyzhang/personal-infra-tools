name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Validate required secrets
        run: |
          test -n "${DEPLOY_HOST}"
          test -n "${DEPLOY_USER}"
          test -n "${DEPLOY_SSH_KEY}"
          test -n "${DEPLOY_PATH}"
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_PORT}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Deploy over SSH
        run: |
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_PATH='${DEPLOY_PATH}' DEPLOY_BRANCH='${DEPLOY_BRANCH}' REPO_URL='${REPO_URL}' bash -s" <<'REMOTE'
          set -eu

          BRANCH="${DEPLOY_BRANCH:-main}"
          APP_DIR="${DEPLOY_PATH}"
          if [ ! -d "$APP_DIR/.git" ]; then
            mkdir -p "$(dirname "$APP_DIR")"
            git clone --branch "$BRANCH" "$REPO_URL" "$APP_DIR"
          fi

          cd "$APP_DIR"

          if [ ! -d .git ]; then
            echo "DEPLOY_PATH exists but is not a git repository: $APP_DIR" >&2
            exit 1
          fi

          git fetch origin "$BRANCH"

          if ! git checkout "$BRANCH"; then
            echo "checkout failed; cleaning local working tree"
            git reset --hard HEAD || true
            git clean -fd -e .env -e '*.secret' -e data/ -e logs/ || true
            git checkout "$BRANCH"
          fi

          if ! git pull --ff-only origin "$BRANCH"; then
            echo "pull failed due to local divergence or dirty tree; forcing remote branch state"
            git reset --hard HEAD || true
            git clean -fd -e .env -e '*.secret' -e data/ -e logs/ || true
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"
          fi

          chmod +x scripts/deploy.sh scripts/smoke_test.sh
          PROJECT_ROOT="$APP_DIR" scripts/deploy.sh
          REMOTE
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_BRANCH: ${{ secrets.DEPLOY_BRANCH || 'main' }}
          REPO_URL: git@github.com:${{ github.repository }}.git
