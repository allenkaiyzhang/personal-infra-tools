name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Validate example registry
        env:
          SERVICE_REGISTRY_PATH: ${{ github.workspace }}/config/services.example.yaml
          PRIVATE_INFO_DB_TOKEN: ci-token
        run: fastapi-message validate-registry --check-token-env

      - name: Run smoke test
        run: sh scripts/smoke_test.sh
