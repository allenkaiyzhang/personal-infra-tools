name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        env:
          OPS_CORE_ALLOW_NO_AUTH: "1"
        run: pytest -q

      - name: Compile package
        run: python -m compileall .

      - name: Smoke test
        env:
          OPS_CORE_ALLOW_NO_AUTH: "1"
        run: |
          python -m uvicorn ops_core.main:app --host 127.0.0.1 --port 8080 &
          server_pid=$!
          trap "kill $server_pid" EXIT
          sleep 2
          sh scripts/smoke_test.sh
