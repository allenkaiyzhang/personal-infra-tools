[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-infra-tools"
version = "0.1.0"
description = "Registry-driven FastAPI service-to-service messaging helpers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "uvicorn>=0.29",
]

[project.scripts]
fastapi-message = "fastapi_message.cli:app"

[tool.setuptools.packages.find]
include = ["fastapi_message*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
