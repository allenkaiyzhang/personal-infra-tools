services:
  ai_agent:
    label: AI Agent
    description: Execute analysis, report, and task-style agent actions.
    base_url: http://127.0.0.1:8001
    auth:
      mode: bearer
      token_env: AI_AGENT_TOKEN
    enabled: true
    actions:
      health:
        label: Health
        method: GET
        path: /health
        timeout_seconds: 5
        safe: true
      demo:
        label: Demo Agent Task
        method: POST
        path: /pipeline/run
        timeout_seconds: 90
        safe: false
        demo_payload:
          task: demo
          input: Run a simple demo analysis and return a short result.

  ai_searcher:
    label: AI Searcher
    description: Search indexed/private/public information through a controlled API.
    base_url: http://127.0.0.1:8002
    auth:
      mode: bearer
      token_env: AI_SEARCHER_TOKEN
    enabled: true
    actions:
      health:
        label: Health
        method: GET
        path: /health
        timeout_seconds: 5
        safe: true
      demo:
        label: Demo Search
        method: POST
        path: /api/search
        timeout_seconds: 30
        safe: true
        demo_payload:
          query: demo
          limit: 5

  private_db:
    label: Private DB
    description: Store and retrieve private information for personal automation.
    base_url: http://127.0.0.1:8003
    auth:
      mode: bearer
      token_env: PRIVATE_DB_TOKEN
    enabled: true
    actions:
      health:
        label: Health
        method: GET
        path: /health
        timeout_seconds: 5
        safe: true
      demo:
        label: Demo Ingest
        method: POST
        path: /api/v1/ingest/text
        timeout_seconds: 30
        safe: false
        demo_payload:
          text: demo private note from ops-core
          source: ops-core-demo
